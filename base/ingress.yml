
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-resource
  namespace: odoo
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - host: argodoo.lab.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: odoo-app-svc
                port:
                  number: 80
